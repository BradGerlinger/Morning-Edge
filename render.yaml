services:
  - type: web
    name: morning-edge-v1
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11
    envVars:
      - key: ALPACA_DATA_FEED
        value: iex
      - key: EDGE_PAPER_NOTIONAL
        value: "100"
      - key: EDGE_MAX_TRADES_DAY
        value: "5"
      - key: EDGE_MAX_OPEN
        value: "3"
      - key: EDGE_DAILY_LOSS_CUTOFF
        value: "10"
      - key: EDGE_LEGACY_SCANNER_ENABLED
        value: "0"
