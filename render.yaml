services:
  - type: web
    name: 15-minute-edge-v10
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: EDGE_DB
        value: /data/edge.db
      - key: EDGE_LEADLAG_ENABLED
        value: "1"
